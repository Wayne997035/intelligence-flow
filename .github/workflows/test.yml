name: Tests

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 此 job 之後沒有任何 git 操作，不需要把 token 留在 .git/config
          # （pytest 會執行 repo 內的程式碼，留著等於多一個可讀取的憑證）
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          # 明列兩個檔：①改 pytest 版本會正確 bust cache
          # ②cache key 與帶著 secrets 的 intel-flow-schedule.yml 不再共用 scope
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
