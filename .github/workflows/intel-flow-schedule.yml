name: Intel Flow Schedule

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只收集與分析，不發送 Discord/Notion（結果以 artifact 上傳）"
        type: boolean
        default: false
  schedule:
    # Asia/Taipei 09:00 daily
    - cron: "00 9 * * *"
      timezone: "Asia/Taipei"
    # Asia/Taipei 18:00 daily
    - cron: "00 18 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: read

concurrency:
  group: intel-flow-schedule
  cancel-in-progress: false

jobs:
  run-intel-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENABLE_AI_ANALYSIS: "true"
      ENABLE_DISCORD_DELIVERY: "true"
      ENABLE_NOTION_DELIVERY: "true"
      # 跨輪去重預設關閉（config.py），排程這裡明確打開 —— 否則 RunStateStore
      # 整個停用，下面的 NOTION_STATE_* 也就永遠用不到，等於這個功能不會執行。
      ENABLE_HISTORY_DEDUP: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_PAT || github.token }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NOTION_INTEGRATION_SECRET: ${{ secrets.NOTION_INTEGRATION_SECRET }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_STATE_DB_ID: ${{ secrets.NOTION_STATE_DB_ID }}
      NOTION_STATE_DS_ID: ${{ secrets.NOTION_STATE_DS_ID }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
      TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intel flow once
        if: ${{ !inputs.dry_run }}
        run: python main.py --once --live-delivery

      # Manual verification path: hits every real source and the AI providers,
      # but delivery stays blocked (DRY_RUN defaults to true without
      # --live-delivery) and history dedup is skipped for dry runs.
      - name: Run intel flow once (dry run)
        if: ${{ inputs.dry_run }}
        env:
          DRY_RUN: "true"
        run: python main.py --once

      - name: Summarize dry run
        if: ${{ always() && inputs.dry_run }}
        run: python scripts/summarize_run.py

      - name: Upload run artifact
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: latest-run
          path: data/latest_run.json
          if-no-files-found: warn
