name: Intel Flow Schedule

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只收集與分析，不發送 Discord/Notion（結果以 artifact 上傳）"
        type: boolean
        default: false
  schedule:
    # Asia/Taipei 09:00 daily
    - cron: "00 9 * * *"
      timezone: "Asia/Taipei"
    # Asia/Taipei 18:00 daily
    - cron: "00 18 * * *"
      timezone: "Asia/Taipei"

permissions:
  contents: read
  # Needed by the keepalive step below to re-enable this workflow via the API.
  actions: write

concurrency:
  group: intel-flow-schedule
  cancel-in-progress: false

jobs:
  run-intel-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENABLE_AI_ANALYSIS: "true"
      ENABLE_DISCORD_DELIVERY: "true"
      ENABLE_NOTION_DELIVERY: "true"
      # 跨輪去重預設關閉（config.py），排程這裡明確打開 —— 否則 RunStateStore
      # 整個停用，下面的 NOTION_STATE_* 也就永遠用不到，等於這個功能不會執行。
      ENABLE_HISTORY_DEDUP: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # Optional repo variables (Settings → Variables) to switch models
      # without a code change; empty falls back to the defaults in config.py.
      # ---- Tunable from GitHub: Settings → Secrets and variables → Actions.
      # Each setting is read from Variables first, then Secrets; leave both
      # unset to use the default in src/config.py.
      # Watchlist (comma separated)
      US_STOCKS: ${{ vars.US_STOCKS || secrets.US_STOCKS }}
      TW_STOCKS: ${{ vars.TW_STOCKS || secrets.TW_STOCKS }}
      # SYMBOL:Alias A|Alias B,SYMBOL2:Alias (names used for news search)
      STOCK_NAME_ALIASES: ${{ vars.STOCK_NAME_ALIASES || secrets.STOCK_NAME_ALIASES }}
      STOCK_WATCH_TOPICS: ${{ vars.STOCK_WATCH_TOPICS || secrets.STOCK_WATCH_TOPICS }}
      TW_STOCK_SOURCE_ORDER: ${{ vars.TW_STOCK_SOURCE_ORDER || secrets.TW_STOCK_SOURCE_ORDER }}
      # AI news focus
      AI_WATCH_TOPICS: ${{ vars.AI_WATCH_TOPICS || secrets.AI_WATCH_TOPICS }}
      AI_MODEL_WATCH: ${{ vars.AI_MODEL_WATCH || secrets.AI_MODEL_WATCH }}
      AI_GITHUB_RELEASE_REPOS: ${{ vars.AI_GITHUB_RELEASE_REPOS || secrets.AI_GITHUB_RELEASE_REPOS }}
      # Time windows
      STOCK_NEWS_LOOKBACK_DAYS: ${{ vars.STOCK_NEWS_LOOKBACK_DAYS || secrets.STOCK_NEWS_LOOKBACK_DAYS }}
      AI_NEWS_LOOKBACK_DAYS: ${{ vars.AI_NEWS_LOOKBACK_DAYS || secrets.AI_NEWS_LOOKBACK_DAYS }}
      AI_HIGH_IMPACT_LOOKBACK_DAYS: ${{ vars.AI_HIGH_IMPACT_LOOKBACK_DAYS || secrets.AI_HIGH_IMPACT_LOOKBACK_DAYS }}
      HISTORY_TTL_HOURS: ${{ vars.HISTORY_TTL_HOURS || secrets.HISTORY_TTL_HOURS }}
      # Optional sources (true / false)
      ENABLE_GOOGLE_NEWS: ${{ vars.ENABLE_GOOGLE_NEWS || secrets.ENABLE_GOOGLE_NEWS }}
      ENABLE_TICKER_NEWS: ${{ vars.ENABLE_TICKER_NEWS || secrets.ENABLE_TICKER_NEWS }}
      # AI models (default auto)
      AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || secrets.NVIDIA_MODEL }}
      # The repo owner chose Gemini -> NVIDIA -> Groq and accepts using
      # NVIDIA's free API Catalog (trial terms: development/evaluation only)
      # for this low-volume personal digest. Override with repo variables.
      NVIDIA_ALLOW_PRODUCTION: ${{ vars.NVIDIA_ALLOW_PRODUCTION || secrets.NVIDIA_ALLOW_PRODUCTION || 'true' }}
      AI_PROVIDER_ORDER: ${{ vars.AI_PROVIDER_ORDER || secrets.AI_PROVIDER_ORDER || 'gemini,nvidia,groq' }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_PAT || github.token }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NOTION_INTEGRATION_SECRET: ${{ secrets.NOTION_INTEGRATION_SECRET }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_STATE_DB_ID: ${{ secrets.NOTION_STATE_DB_ID }}
      NOTION_STATE_DS_ID: ${{ secrets.NOTION_STATE_DS_ID }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
      TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # GitHub disables scheduled workflows after 60 days without repository
      # activity (it happened on 2026-10-01, 60 days after the last push).
      # Re-enabling via the API on every run keeps the schedule alive without
      # needing keepalive commits. Runs first so a failing report run still
      # extends the schedule; never fails the job.
      - name: Show effective settings
        run: python scripts/show_config.py

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/intel-flow-schedule.yml/enable" \
            && echo "Schedule keepalive OK" \
            || echo "::warning::Schedule keepalive failed; re-enable the workflow manually if it gets disabled"

      - name: Run intel flow once
        if: ${{ !inputs.dry_run }}
        run: python main.py --once --live-delivery

      # Every failure inside the run is recorded instead of raised, so both
      # reports are still delivered (rule-based summary or a failure notice
      # at worst). This step then turns the job red for anything that needs
      # attention, so GitHub emails about it instead of it going unnoticed.
      - name: Check run health
        if: ${{ always() && !inputs.dry_run }}
        run: |
          python - <<'PY'
          import json, sys
          meta = json.load(open("data/latest_run.json"))["meta"]
          errors = meta.get("errors") or {}
          failed = False
          for report, reason in (meta.get("ai_errors") or {}).items():
              print(f"::error::{report} report fell back to rule-based summary (all AI providers failed): {reason}")
              failed = True
          for kind in ("delivery", "report"):
              for message in errors.get(kind, []):
                  print(f"::error::{kind}: {message}")
                  failed = True
          for kind in ("collection", "state"):
              for message in errors.get(kind, []):
                  print(f"::warning::{kind}: {message}")
          sys.exit(1 if failed else 0)
          PY

      # Manual verification path: hits every real source and the AI providers,
      # but delivery stays blocked (DRY_RUN defaults to true without
      # --live-delivery) and history dedup is skipped for dry runs.
      - name: Run intel flow once (dry run)
        if: ${{ inputs.dry_run }}
        env:
          DRY_RUN: "true"
        run: python main.py --once

      - name: Summarize dry run
        if: ${{ always() && inputs.dry_run }}
        run: python scripts/summarize_run.py

      - name: Upload run artifact
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: latest-run
          path: data/latest_run.json
          if-no-files-found: warn
