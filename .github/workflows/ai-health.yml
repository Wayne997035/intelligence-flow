name: AI health check

# Calls Gemini, Groq and NVIDIA once each with the real secrets. Passes while at
# least one answers (the analyzer falls back Gemini -> Groq -> NVIDIA), warns about any
# provider that fails, and fails when none does. Runs on PRs that touch the analyzer and on demand, so a
# revoked key or a retired model shows up as a red check instead of reports
# silently falling back to local synthesis.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/ai/**"
      - "src/config.py"
      - "scripts/ai_healthcheck.py"
      - "requirements.txt"
      - ".github/workflows/ai-health.yml"

permissions:
  contents: read

jobs:
  ai-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL || secrets.AI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL || secrets.NVIDIA_MODEL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Check Gemini, Groq and NVIDIA
        run: python scripts/ai_healthcheck.py
