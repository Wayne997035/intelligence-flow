name: Live smoke

# Exercises the keyless live sources (yfinance, Yahoo ticker news, Google News
# RSS, official AI feeds) against the real network. Uses no secrets.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/collectors/**"
      - "src/pipeline.py"
      - "main.py"
      - "scripts/live_smoke.py"
      - ".github/workflows/live-smoke.yml"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Live smoke
        run: python scripts/live_smoke.py
      - name: Digest
        if: always()
        run: python scripts/summarize_run.py || true
